; HikaShop - Hide download files by shipping method
; @package plg_hikashop_filesbyshipping

PLG_HIKASHOP_FILESBYSHIPPING="HikaShop - Hide download files by shipping method"
PLG_HIKASHOP_FILESBYSHIPPING_DESC="Companion to the HikaSerial 'Serials by Shipping' plugin. Hides the product download button in the order e-mail, the front-end order page and the back-end order view for orders whose shipping method is not in the allowed list. Qualifying (E-Mails) orders keep their ticket download."

PLG_HIKASHOP_FILESBYSHIPPING_SHIPPING_IDS_LABEL="Allowed shipping method(s)"
PLG_HIKASHOP_FILESBYSHIPPING_SHIPPING_IDS_DESC="Leave empty to use the same list as the HikaSerial 'Serials by Shipping' plugin (recommended, so you only maintain one list). Select methods here only if you want this plugin to use a different list."

PLG_HIKASHOP_FILESBYSHIPPING_NOSHIP_LABEL="When an order has no shipping method"
PLG_HIKASHOP_FILESBYSHIPPING_NOSHIP_DESC="What to do for orders that have no shipping method at all (e.g. free/virtual orders)."
PLG_HIKASHOP_FILESBYSHIPPING_NOSHIP_BLOCK="Hide the download button"
PLG_HIKASHOP_FILESBYSHIPPING_NOSHIP_SEND="Keep the download button"

PLG_HIKASHOP_FILESBYSHIPPING_DEBUG_LABEL="Debug logging"
PLG_HIKASHOP_FILESBYSHIPPING_DEBUG_DESC="Log each decision to administrator/logs/plg_hikashop_filesbyshipping.php. Turn off in production."
