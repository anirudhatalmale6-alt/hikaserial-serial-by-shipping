; plg_hikaserial_serialbyshipping language strings
PLG_HIKASERIAL_SERIALBYSHIPPING="HikaSerial - Send Tickets by Shipping Method"
PLG_HIKASERIAL_SERIALBYSHIPPING_DESC="Only delivers the HikaSerial ticket (PDF/image) when the order used one of the selected shipping methods (e.g. E-Mails). The serial layout and default e-mail template are untouched."

PLG_HIKASERIAL_SERIALBYSHIPPING_SHIPPING_IDS_LABEL="Allowed shipping method(s)"
PLG_HIKASERIAL_SERIALBYSHIPPING_SHIPPING_IDS_DESC="Tickets are e-mailed only for orders that used one of these shipping methods (your Email dispatch types). You may select several."

PLG_HIKASERIAL_SERIALBYSHIPPING_NOSHIP_LABEL="When an order has no shipping method"
PLG_HIKASERIAL_SERIALBYSHIPPING_NOSHIP_DESC="What to do if an order has no shipping method at all (e.g. free/virtual-only orders)."
PLG_HIKASERIAL_SERIALBYSHIPPING_NOSHIP_BLOCK="Do not send the ticket"
PLG_HIKASERIAL_SERIALBYSHIPPING_NOSHIP_SEND="Send the ticket anyway"

PLG_HIKASERIAL_SERIALBYSHIPPING_DEBUG_LABEL="Debug logging"
PLG_HIKASERIAL_SERIALBYSHIPPING_DEBUG_DESC="Write each decision to the Joomla log (administrator/logs/plg_hikaserial_serialbyshipping.php). Turn off in production."
